<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>J&amp;N ระบบงานโรงงาน</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#D8392F">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first single column; red brand band on top, white working surface. Tokens below. */
:root{
  --red:#D8392F; --red-deep:#B32A22; --red-tint:#FCEBEA;
  --slate:#3B4750; --bg:#F7F5F4; --surface:#FFFFFF; --line:#E6E1DF;
  --fg:#22292E; --muted:#6B7378; --on-red:#FFFFFF;
  --ok:#1F7A4D; --ok-tint:#E6F3EC; --warn:#A15C00; --warn-tint:#FFF3DE;
  --f-display:"Prompt","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --red:#E5554B; --red-deep:#C9433A; --red-tint:#3A1E1C; --slate:#AEB8BF;
  --bg:#161A1D; --surface:#1F2428; --line:#30373C; --fg:#ECEEEF; --muted:#9AA3A8;
  --ok:#5CC28E; --ok-tint:#18302A; --warn:#F0B35C; --warn-tint:#352A17; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--red) 55%,transparent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.bar{position:sticky;top:0;z-index:5;background:var(--red);color:var(--on-red);padding-top:env(safe-area-inset-top,0px)}
.bar-in{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo-chip{background:#fff;border-radius:8px;padding:4px 8px;display:flex;flex:none}
.logo-chip img{height:30px;width:auto;display:block}
.bar-title{flex:1;min-width:0}
.bar-title b{display:block;font-family:var(--f-display);font-size:16px;line-height:1.2}
.bar-title span{font-size:12px;opacity:.85}
.who{text-align:right;font-size:12px;line-height:1.3}
.who b{display:block;font-size:14px}

main{padding-block:18px 64px;display:grid;gap:16px}
.hello h2{font-size:20px}
.hello p{margin:2px 0 0;color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px;text-align:left;cursor:pointer;display:grid;gap:2px;min-height:86px;align-content:start}
.tile b{font-family:var(--f-display);font-size:16px;color:var(--red)}
.tile span{font-size:12.5px;color:var(--muted)}
.tile:hover{border-color:var(--red)}
.tile.main{grid-column:1/-1;background:var(--red);border-color:var(--red)}
.tile.main b,.tile.main span{color:var(--on-red)}
.admin{display:flex;flex-wrap:wrap;gap:8px}
.admin a,.admin button{flex:1 1 200px;text-align:center;border:1.5px solid var(--slate);color:var(--slate);background:none;border-radius:10px;padding:10px;text-decoration:none;font-weight:600;cursor:pointer}

section.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px}
.panel h3{font-size:16px}
.head{display:flex;align-items:center;gap:10px}
.back{background:none;border:1.5px solid var(--line);border-radius:9px;padding:6px 12px;cursor:pointer}
.head h2{font-size:19px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:440px){.grid2:not(.keep){grid-template-columns:1fr}}
.field{display:grid;gap:5px;min-width:0}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--slate)}
.opt{font-weight:400;color:var(--muted)}
input,select,textarea{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);padding:8px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--red);outline:none}
textarea{min-height:60px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1 1 auto;min-height:44px;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 12px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--on-red)}
.item{border:1.5px dashed var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.item-head{display:flex;justify-content:space-between;align-items:center}
.item-head b{font-family:var(--f-display);font-size:14px;color:var(--red)}
.rm{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;text-decoration:underline}
.hint{font-size:12.5px;color:var(--muted)}
.hint.warn,.warnbox{color:var(--warn)}
.warnbox{background:var(--warn-tint);border-radius:9px;padding:10px 12px;font-size:13.5px}
.err{font-size:13px;color:var(--red);font-weight:600}
.add{border:1.5px dashed var(--red);color:var(--red);background:var(--red-tint);border-radius:10px;min-height:46px;font-weight:600;cursor:pointer;width:100%}
.primary{background:var(--red);color:var(--on-red);border:0;border-radius:10px;min-height:52px;font-family:var(--f-display);font-size:17px;font-weight:600;cursor:pointer;width:100%}
.primary:disabled{opacity:.6}
.ghost{background:none;border:1.5px solid var(--line);border-radius:10px;min-height:52px;font-weight:600;cursor:pointer}
.total{display:flex;justify-content:space-between;align-items:baseline;background:var(--red-tint);border-radius:10px;padding:12px 14px}
.total b{font-size:19px;color:var(--red)}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 120px 56px;gap:8px;align-items:center;padding-block:4px;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow input{min-height:40px;padding:6px 10px}
.qrow .u{font-size:12px;color:var(--muted)}
.qrow.fish{grid-template-columns:minmax(0,1fr) 100px 90px}
.list{display:grid;gap:8px}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.entry .t{font-weight:600}
.entry .meta{grid-column:1/-1;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.chip{font-size:11.5px;font-weight:600;border-radius:99px;padding:1px 9px;background:var(--red-tint);color:var(--red)}
.kg{font-family:var(--f-num);text-align:right}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:12px}

.overlay{position:fixed;inset:0;background:rgba(10,12,14,.55);z-index:20;display:grid;place-items:end center}
.sheet{background:var(--surface);width:100%;max-width:640px;border-radius:16px 16px 0 0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;max-height:88vh;overflow:auto}
@media (min-width:700px){.overlay{place-items:center}.sheet{border-radius:16px}}
.sum-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:9px 12px;border:1px solid var(--line);border-radius:9px}
.sum-row small{display:block;color:var(--muted)}
.btns{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ok);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}
.toast.bad{background:var(--red)}
.center{min-height:70vh;display:grid;place-items:center;text-align:center;padding:24px}
.center img{width:140px;margin:0 auto 16px;display:block}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;margin:16px auto;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
.tile.ceo{width:100%;background:var(--slate);border-color:var(--slate)}
.tile.ceo b,.tile.ceo span{color:#fff}
@media (prefers-color-scheme: dark){.tile.ceo{background:#2B343A;border-color:#46525A}}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px;align-content:start;min-width:0}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi b{font-size:20px;font-weight:500;line-height:1.25;overflow-wrap:anywhere}
.kpi small{font-size:12px;color:var(--muted)}
.kpi.hero{grid-column:1/-1;border-color:var(--red);border-width:1.5px}
.kpi.hero b{font-size:30px;color:var(--red)}
.dl{font-size:12.5px;font-weight:600}.dl.bad{color:var(--red)}.dl.good{color:var(--ok)}
.bars{display:flex;align-items:flex-end;gap:4px;height:170px;padding-top:4px}
.bc{flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.bc i{display:block;width:100%;max-width:26px;background:var(--red);border-radius:4px 4px 0 0}
.bv{font-family:var(--f-num);font-size:9.5px;color:var(--fg);white-space:nowrap;writing-mode:vertical-rl;transform:rotate(180deg)}
.bl{font-size:9.5px;color:var(--muted);white-space:nowrap;overflow:hidden;max-width:100%}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);gap:2px}
.stack i{display:block;height:100%}
.c1{background:#D8392F}.c2{background:#E8913A}.c3{background:#3B4750}.c4{background:#8A9AA4}.c5{background:#2E8C8C}
@media (prefers-color-scheme: dark){.c3{background:#AEB8BF}.c4{background:#6B7A84}}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.rows{display:grid;gap:2px}
.rows .r{display:grid;grid-template-columns:minmax(0,1fr) auto 44px;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);align-items:baseline}
.rows .r em{font-style:normal;font-size:12.5px;color:var(--muted);text-align:right}
.rows .r.tot{font-weight:600;border-bottom:0}
.cg{border:1px solid var(--line);border-radius:10px;padding:2px 10px;margin-bottom:8px}.cg summary{display:flex;justify-content:space-between;align-items:center;min-height:44px;list-style:none}.cg summary::-webkit-details-marker{display:none}.cg summary::before{content:'▸';margin-right:6px;color:var(--muted)}.cg[open] summary::before{content:'▾'}.cg summary>span:first-child{flex:1}.cg[open] summary{border-bottom:1px solid var(--line)}
.opn{margin-top:6px}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:8px}.rhead h3{margin:0}.linkbtn{background:none;border:0;color:var(--red);font-weight:600;font-size:14px;cursor:pointer;padding:6px 0}
.tile.lab{border-color:#8A9AA4}
details summary{cursor:pointer;color:var(--slate);font-weight:600;font-size:14px;padding:4px 0}
.tbl{overflow-x:auto}
.tbl table{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-weight:600;color:var(--muted);font-size:12px}
.warnp{background:var(--warn-tint);border-color:transparent;color:var(--warn);gap:4px}.warnp p{margin:0;font-size:13.5px}
#dash{display:grid;gap:16px;min-width:0}
main>*,section.panel>*,.kpis>*{min-width:0}
.tbl{max-width:100%}.tbl td:first-child{white-space:normal;word-break:break-word}
.szgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}.szc{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--slate)}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.bxh{font-family:var(--f-display);color:var(--red);font-size:14px}
.linkbtn{background:none;border:0;color:var(--red);font-weight:600;cursor:pointer;text-decoration:underline;padding:0 4px}
.who .out{background:none;border:0;color:inherit;opacity:.85;font-size:12px;text-decoration:underline;padding:2px 0;cursor:pointer;display:block;margin-left:auto}
/* ซ่อมบำรุงเครื่องจักร */
.tile.mt{border-color:var(--slate)}
.mtbody{display:grid;gap:16px;min-width:0}
.chip.over{background:var(--red);color:#fff}.chip.soon{background:var(--warn-tint);color:var(--warn)}.chip.okc{background:var(--ok-tint);color:var(--ok)}
.entry .linkbtn{padding:0;text-decoration:none;white-space:nowrap}
.mtd{grid-column:1/-1;font-size:13.5px}.mtd p{margin:2px 0;overflow-wrap:anywhere}
.mtclose{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:6px}.mtclose .ghost{min-height:46px;padding:0 14px}
.mtck{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
#mf{display:grid;gap:16px}
.mtck input{width:22px;height:22px;min-height:22px;flex:none;margin:1px 0 0;padding:0;accent-color:var(--red)}
</style>
</head>
<body>
<div id="boot" class="center"><div><img data-logo src="" alt="J&amp;N International Co., Ltd."><div class="spinner"></div><p class="hint">กำลังโหลด…</p></div></div>
<div id="auth" class="center" hidden><div><img data-logo src="" alt="J&amp;N International Co., Ltd."><h2>เข้าสู่ระบบ</h2><p class="hint">ใช้บัญชี Google (Gmail) ที่ออฟฟิศลงทะเบียนไว้</p><div id="gbtn" style="display:flex;justify-content:center;margin:14px 0"></div><p class="hint">ครั้งต่อไประบบจะเข้าให้อัตโนมัติ</p></div></div>
<div id="app" hidden>
  <header class="bar"><div class="wrap bar-in">
    <div class="logo-chip"><img data-logo src="" alt="J&amp;N"></div>
    <div class="bar-title"><b>J&amp;N ระบบงานโรงงาน</b><span>J&amp;N International Co., Ltd.</span></div>
    <div class="who"><b id="who"></b><span id="whoRole"></span><button type="button" class="out" id="outBtn">ออกจากระบบ</button></div>
  </div></header>
  <main class="wrap" id="view"></main>
</div>
<div class="overlay" id="ov" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ovT">
  <h3 id="ovT">ตรวจสอบก่อนบันทึก</h3><div class="hint" id="ovHead"></div><div class="list" id="ovList"></div>
  <div class="btns"><button type="button" class="ghost" id="ovBack">แก้ไข</button><button type="button" class="primary" id="ovOk">ยืนยันบันทึก</button></div>
</div></div>
<div class="toast" id="toast" hidden></div>

(function(){
const $=s=>document.querySelector(s), $$=(s,el)=>[...(el||document).querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(n,d)=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:d||0,maximumFractionDigits:d==null?2:d});
const LINE='ไลน์ผลิต';
let B=null, factory='J&N', pending=null;

const API_URL="https://script.google.com/macros/s/AKfycbw2Usx2dlYGnyAS_lyF9s-zzX6v_aZk1qZegvauUZyzAa7FMcHWy1czWG3QTV4-tb3BKg/exec", CLIENT_ID="689781745326-fq78g6d4v36bsli76g66to0520d0h53l.apps.googleusercontent.com";
/* ---------- Google sign-in (ID token, verified by the server) ---------- */
const TK='jn_tok';
let tok=null; try{tok=JSON.parse(localStorage.getItem(TK)||'null');}catch(e){}
const tokOk=()=>tok&&tok.exp-Date.now()>120e3;
let authWait=null;
function jwtExp(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp*1000;}catch(e){return 0;}}
function onCred(r){tok={t:r.credential,exp:jwtExp(r.credential)};try{localStorage.setItem(TK,JSON.stringify(tok));}catch(e){}
  $('#auth').hidden=true;if(authWait){const w=authWait;authWait=null;w();}}
function gisReady(){return new Promise(res=>{const c=()=>window.google&&google.accounts&&google.accounts.id?res():setTimeout(c,50);c();});}
let gisInit=false;
function signIn(){
  if(tokOk())return Promise.resolve();
  return new Promise(res=>{authWait=res;gisReady().then(()=>{
    if(!gisInit){google.accounts.id.initialize({client_id:CLIENT_ID,callback:onCred,auto_select:true,use_fedcm_for_prompt:true,cancel_on_tap_outside:false});gisInit=true;}
    $('#boot').hidden=true;$('#auth').hidden=false;
    google.accounts.id.renderButton($('#gbtn'),{theme:'filled_blue',size:'large',text:'signin_with',shape:'pill',locale:'th'});
    google.accounts.id.prompt();
  });});
}
function signOut(){try{localStorage.removeItem(TK);}catch(e){}tok=null;try{google.accounts.id.disableAutoSelect();}catch(e){}location.reload();}
async function call(fn,args){
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args,token:tok&&tok.t})});
  if(!r.ok)throw new Error('เซิร์ฟเวอร์ตอบกลับผิดพลาด ('+r.status+') ลองใหม่อีกครั้ง');
  return r.json();
}
async function run(fn,...args){
  await signIn();
  let j;
  try{j=await call(fn,args);}catch(e){throw new Error(navigator.onLine?(e.message||'เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง'):'ไม่มีอินเทอร์เน็ต ลองใหม่อีกครั้ง');}
  if(!j.ok&&j.code==='AUTH'){tok=null;try{localStorage.removeItem(TK);}catch(e){}await signIn();j=await call(fn,args);}
  if(!j.ok)throw new Error(j.error||'เกิดข้อผิดพลาด');
  return j.result;
}
function toast(t,bad){const el=$('#toast');el.textContent=t;el.className='toast'+(bad?' bad':'');el.hidden=false;clearTimeout(el._t);el._t=setTimeout(()=>el.hidden=true,3500);}

/* ---------- master helpers ---------- */
const M=()=>B.masters;
const fishItems=()=>M().items.filter(i=>i.cat==='ปลา');
const species=()=>[...new Set(fishItems().map(i=>i.name.replace(/ \((ปลาตัว|ปลาตัด)\)$/,'')))];
const otherItems=()=>M().items.filter(i=>i.cat!=='ปลา');
const itemBy=n=>M().items.find(i=>i.name===n);
const locs=t=>M().locations.filter(l=>l.factory===factory&&(!t||l.type===t));
const storeLoc=()=>(locs('คลัง')[0]||{name:'คลังวัตถุดิบ '+factory}).name;
const coldLocs=()=>locs('ห้องเย็น').map(l=>l.name);
function itemOptions(list,blank){
  const cats=[...new Set(list.map(i=>i.cat))];
  return (blank?`<option value="">${blank}</option>`:'')+cats.map(c=>`<optgroup label="${esc(c)}">`+list.filter(i=>i.cat===c).map(i=>`<option>${esc(i.name)}</option>`).join('')+'</optgroup>').join('');
}
const skuOptions=all=>'<option value="">เลือกสินค้า</option>'+M().skus.filter(s=>all||s.unit!=='ขวด').map(s=>`<option>${esc(s.name)}</option>`).join('');
function seg(name,opts,val){return `<div class="seg" data-seg="${name}" role="group">`+opts.map(o=>{const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;return `<button type="button" data-v="${esc(v)}" aria-pressed="${v===val}">${esc(l)}</button>`;}).join('')+'</div>';}
const segVal=(el,name)=>{const b=(el||document).querySelector(`[data-seg="${name}"] [aria-pressed="true"]`);return b?b.dataset.v:'';};
document.addEventListener('click',e=>{const b=e.target.closest('.seg button');if(!b)return;const s=b.parentElement;$$('button',s).forEach(x=>x.setAttribute('aria-pressed',x===b));s.dispatchEvent(new CustomEvent('segchange',{bubbles:true,detail:b.dataset.v}));});
const val=(el,sel)=>{const x=(el||document).querySelector(sel);return x?x.value.trim():'';};
const n=v=>v===''?NaN:Number(v);
function shrink(file){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{const max=1600;let w=img.width,h=img.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.7));};img.onerror=()=>rej(new Error('อ่านรูปไม่ได้ ลองถ่ายใหม่'));img.src=url;});}

/* ---------- boot ---------- */
$('#outBtn').onclick=signOut;
run('getBoot').then(b=>{
  if(!b.ok){
    $('#boot').innerHTML=`<div><img src="${LOGO}" alt="J&amp;N"><h2>ยังไม่มีสิทธิ์เข้าใช้งาน</h2><p class="hint">บัญชี <b>${esc(b.email||'(ไม่ทราบอีเมล)')}</b> ${b.reason==='noaccess'?'ยังไม่ได้รับสิทธิ์ไฟล์บันทึก กรุณารอ 5 นาทีแล้วเปิดใหม่ หรือแจ้งออฟฟิศ':'ยังไม่อยู่ในรายชื่อผู้ใช้'}<br>กรุณาแจ้งออฟฟิศเพื่อเพิ่มอีเมลนี้${b.detail?'<br><small style="color:#999">'+esc(b.detail)+'</small>':''}</p></div>`;
    $('#boot').insertAdjacentHTML('beforeend','<p style="text-align:center"><button type="button" class="linkbtn" id="swBtn">เปลี่ยนบัญชี Google</button></p>');$('#swBtn').onclick=signOut;
    return;
  }
  B=b; factory=b.user.factory||'J&N';
  $('#who').textContent=b.user.name; $('#whoRole').textContent=b.user.role+' • '+factory;
  $('#boot').hidden=true; $('#app').hidden=false; home();
}).catch(err=>{$('#boot').innerHTML=`<div><h2>เปิดแอปไม่สำเร็จ</h2><p class="hint">${esc(err&&err.message||err)}</p><p class="hint">ลองรีเฟรชหน้า หรือแจ้งออฟฟิศ</p></div>`;});

/* ---------- CEO dashboard ---------- */
const baht=v=>v==null||isNaN(v)?'–':'฿'+Number(v).toLocaleString('en-US',{maximumFractionDigits:v<100?2:0,minimumFractionDigits:v<100?2:0});
const pct=(a,b)=>b?Math.round(a/b*100)+'%':'–';
const dshort=s=>{const d=new Date(s+'T00:00');return d.toLocaleDateString('th-TH',{day:'numeric',month:'short'});};
let dashFac='ทั้งหมด';
function fDash(){
  $('#view').innerHTML=`<div class="head"><button type="button" class="back" id="back">← กลับ</button><h2>ภาพรวม CEO</h2></div>
  <section class="panel"><div class="field"><span class="lbl">โรงงาน</span>${seg('dfac',['ทั้งหมด','J&N','สุภาภรณ์'],dashFac)}</div></section>
  <div id="dash"><div class="center" style="min-height:30vh"><div class="spinner"></div></div></div>`;
  $('#back').onclick=home;
  $('[data-seg="dfac"]').addEventListener('segchange',e=>{dashFac=e.detail;loadDash();});
  window.scrollTo(0,0); loadDash();
}
function loadDash(){
  $('#dash').innerHTML='<div class="center" style="min-height:30vh"><div class="spinner"></div></div>';
  run('getDashboard',dashFac).then(renderDash).catch(e=>{$('#dash').innerHTML=`<section class="panel"><p class="warnbox">${esc(e.message||e)}</p></section>`;});
}
function delta(cur,prev){
  if(cur==null||prev==null||!prev) return '';
  const p=(cur-prev)/prev*100, up=p>0;
  return `<span class="dl ${up?'bad':'good'}">${up?'▲':'▼'} ${Math.abs(p).toFixed(1)}% จากสัปดาห์ก่อน</span>`;
}
function bars(list,fmtV,label){
  const max=Math.max(...list.map(x=>x.v||0),0);
  return `<div class="bars" role="img" aria-label="${esc(label)}">${list.map(x=>`<div class="bc" title="${esc(x.l)}: ${esc(fmtV(x.v))}"><span class="bv">${x.v?esc(fmtV(x.v)):''}</span><i style="height:${max&&x.v?Math.max(4,x.v/max*100):0}%"></i><span class="bl">${esc(x.l)}</span></div>`).join('')}</div>`;
}
function renderDash(d){
  const L=d.last, W=d.week, P=d.prevWeek, M=d.month;
  const warn=[];
  if(M.noPrice) warn.push(`มี ${M.noPrice} รายการใช้ผลิตเดือนนี้ที่ยังไม่มีราคา → ต้นทุนอาจต่ำกว่าจริง`);
  if(M.noLabor) warn.push(`มี ${M.noLabor} วันผลิตเดือนนี้ที่ยังไม่กรอกค่าแรง`);
  const parts=[['ปลา',M.fish,'c1'],['วัตถุดิบ/ซอส',M.mat,'c2'],['บรรจุภัณฑ์',M.pack,'c3'],['สิ้นเปลือง/พลังงาน',M.other,'c4'],['ค่าแรง+OT',M.labor+M.ot,'c5']];
  const fgTot=d.fg.reduce((a,x)=>({wl:a.wl+x.waitLabel,wb:a.wb+x.waitBox,r:a.r+x.ready}),{wl:0,wb:0,r:0});
  $('#dash').innerHTML=`
  ${warn.length?`<section class="panel warnp">${warn.map(w=>`<p>⚠️ ${esc(w)}</p>`).join('')}</section>`:''}
  <div class="kpis">
    <div class="kpi hero"><span>ต้นทุน/ลัง • สัปดาห์นี้</span><b class="num">${baht(W.perCarton)}</b>${delta(W.perCarton,P.perCarton)}<small>${baht(W.perCan)} ต่อกระป๋อง • ${fmt(W.good)} กป</small></div>

function fLabor(){
  shell('labor',`<section class="panel" id="labP"></section>`);
  const money=(id,lab)=>`<div class="field"><label for="${id}">${lab}</label><input id="${id}" class="num lab" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"></div>`;
  const noteF=`<div class="field"><label for="note">หมายเหตุ <span class="opt">(เช่น จำนวนคน ชม. OT)</span></label><textarea id="note"></textarea></div>`;
  const sp=()=>factory==='สุภาภรณ์';
  const tally=()=>{const t=$('#tVal');if(!t)return;let s=0;$$('#labP .lab').forEach(x=>s+=n(x.value)||0);t.textContent='฿'+fmt(s,2);};
  const load=()=>{const m=$('#labMsg');if(!m)return;m.textContent='กำลังโหลด…';
    run('getLaborDay',val(null,'#date'),factory).then(d=>{if(!$('#labMsg'))return;
      if(!d){m.textContent='ยังไม่มีข้อมูลของวันนี้';return;}
      ['wP','otP','wK','otK','ice'].forEach(k=>{const x=$('#'+k);if(x)x.value=(d[k]===''||d[k]==null)?'':d[k];});if($('#note'))$('#note').value=d.note||'';
      m.innerHTML=`มีข้อมูลแล้ว (บันทึกโดย ${esc(d.by||'')} ${esc(d.at||'')}) • <b>บันทึกใหม่จะแทนที่ของเดิม</b>`;tally();
    }).catch(e=>{if($('#labMsg'))$('#labMsg').textContent=e.message||e;});};
  const draw=()=>{
    $('#labP').innerHTML=(sp()?`<h3>สุภาภรณ์ (โรงงาน OEM)</h3><div class="hint">ค่าผลิตต่อลัง ระบบคิดอัตโนมัติจากยอดผลิต • ช่องนี้กรอกเฉพาะ<b>ยอดบิลค่าน้ำแข็ง</b> (ถ้ามี)</div>${money('ice','ค่าน้ำแข็ง (ยอดบิล บาท)')}`
      :`<h3>ค่าแรงรวมของวัน (บาท)</h3><div class="hint">ใส่<b>ยอดรวมทั้งวัน</b> ไม่ต้องแยกรายคน • ไม่มี OT เว้นว่างหรือใส่ 0</div><div class="grid2">${money('wP','ค่าแรงฝ่ายผลิต')}${money('otP','OT ฝ่ายผลิต')}</div><div class="grid2">${money('wK','ค่าแรงฝ่ายแพ็ก')}${money('otK','OT ฝ่ายแพ็ก')}</div>`)
      +noteF+`<div class="total"><span>รวม</span><b class="num" id="tVal">฿0</b></div><p class="hint" id="labMsg"></p>`;
    $('#labP').addEventListener('input',tally);tally();load();};
  refreshLocs=draw;$('#date').addEventListener('change',load);draw();
  pending=()=>{const errs=[],sum=[],ks=sp()?[['ice','ค่าน้ำแข็ง (ยอดบิล)']]:[['wP','ค่าแรงฝ่ายผลิต'],['otP','OT ฝ่ายผลิต'],['wK','ค่าแรงฝ่ายแพ็ก'],['otK','OT ฝ่ายแพ็ก']];const p={note:val(null,'#note')};let any=false,tot=0;
    ks.forEach(([k,l])=>{const v=val(null,'#'+k);if(v==='')return;const q=Number(v);if(!(q>=0)){errs.push(l+': ตัวเลขไม่ถูกต้อง');return;}any=true;p[k]=q;tot+=q;sum.push([l,'',fmt(q,2)+' บาท']);});
    if(!any&&!errs.length)errs.push('กรอกอย่างน้อย 1 ช่อง');
    sum.push(['รวม','',fmt(tot,2)+' บาท']);
    return {errs,sum,head:'ค่าแรง / OT',payload:p};};
}

function fHist(){
  $('#view').innerHTML=`<div class="head"><button type="button" class="back" id="back">← กลับ</button><h2>ประวัติของฉัน (7 วัน)</h2></div>

  <div id="hist"><div class="center" style="min-height:30vh"><div class="spinner"></div></div></div>`;
  $('#back').onclick=home; window.scrollTo(0,0);
  run('getMyHistory').then(list=>{
    if(!list.length){$('#hist').innerHTML='<section class="panel"><div class="empty">ยังไม่มีรายการใน 7 วันนี้</div></section>';return;}
    const by={};list.forEach(r=>{const k=r.day||r.saved;(by[k]=by[k]||[]).push(r);});
    const dl=k=>{const d=new Date(k+'T00:00');return isNaN(d)?k:d.toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'});};
    const sl=k=>{const d=new Date(k+'T00:00');return isNaN(d)?k:d.getDate()+'/'+(d.getMonth()+1);};
    $('#hist').innerHTML=Object.keys(by).sort().reverse().map(k=>`<section class="panel"><h3>${esc(dl(k))} <span class="opt">(${by[k].length} รายการ)</span></h3><div class="list">${by[k].map(r=>`<div class="entry"><span class="t">${esc(r.title)}</span><span class="kg">${fmt(r.qty)} ${esc(r.unit)}</span><div class="meta"><span class="chip">${esc(r.kind)}</span><span>${esc(r.detail)} • บันทึก ${r.saved!==k?esc(sl(r.saved))+' ':''}${esc(r.time)} น.</span></div></div>`).join('')}</div></section>`).join('');
  }).catch(e=>{$('#hist').innerHTML=`<section class="panel"><p class="warnbox">${esc(e.message||e)}</p></section>`;});
}

/* date safeguard: show the chosen date in Thai words; block dates that look like a day/month mix-up */
const DATE_MAX_BACK=31;
function dateBack(){const v=val(null,'#date');if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return null;return Math.round((new Date(B.today+'T00:00')-new Date(v+'T00:00'))/864e5);}

  el.textContent=t+(n===0?' (วันนี้)':n>0?' • ย้อนหลัง '+n+' วัน':' • วันที่ในอนาคต');el.className='hint'+(n>7||n<0?' warn':'');}
function addLine(container,html,label){

  box.appendChild(d); return d;
}

    d.querySelector('.basef').hidden=!it||!!it.pack; d.querySelector('.lotrow').hidden=!it||it.cat!=='วัตถุดิบ'; totals();};
  const reset=()=>{setSup();$('#lines').innerHTML='';add();totals();};

  function totals(){
    if(mode()==='fish'){let c=0,k=0;$$('#lines .item').forEach(d=>{const cr=n(val(d,'.crates')),kg=n(val(d,'.kg'));c+=cr||0;k+=kg||0;const a=d.querySelector('.avg');
      if(cr&&kg){const per=kg/cr;a.textContent='เฉลี่ย '+per.toFixed(1)+' กก./กระบะ'+(per<10||per>40?' • ตัวเลขดูผิดปกติ ลองเช็กอีกครั้ง':'');a.className='hint avg'+(per<10||per>40?' warn':'');}else a.textContent='';});
      $('#tSub').textContent='รวม '+fmt(c)+' กระบะ';$('#tVal').textContent=fmt(k,2)+' กก.';}
    else{$$('#lines .item').forEach(d=>{const it=itemBy(val(d,'.it'));const q=n(val(d,'.qty'));const cv=d.querySelector('.conv');
      cv.textContent=it&&it.pack&&q?'= '+fmt(q*it.pack)+' '+it.base+' (ขนาดคงที่ '+it.pack+' '+it.base+'/'+it.unit+')':'';});
      $('#tSub').textContent=$$('#lines .item').length+' รายการ';$('#tVal').textContent='';}
  }
  $('#photo').onchange=async()=>{const f=$('#photo').files[0];if(!f){photoData='';$('#photoPrev').hidden=true;return;}try{photoData=await shrink(f);$('#photoPrev').src=photoData;$('#photoPrev').hidden=false;}catch(e){photoData='';toast(e.message,true);}};
  reset();
  pending=()=>{

    if(!sup)errs.push('เลือกผู้ขาย');
    $$('#lines .item').forEach((d,i)=>{
      if(fish){const sp=val(d,'.sp'),fm=segVal(d,'form'),kg=n(val(d,'.kg')),cr=n(val(d,'.crates')),loc=segVal(d,'dest');
        if(!sp||!fm||!(kg>0)||!(cr>=0)){errs.push(`ปลาชนิดที่ ${i+1}: เลือกชนิด รูปแบบ (ตัว/ตัด) และกรอกกระบะ + น้ำหนัก`);return;}
        const item=sp+' ('+fm+')';const pr=val(d,'.price');lines.push({item,loc,kg,crates:cr,price:pr});sum.push([item,(loc===LINE?'เข้าไลน์ผลิตตรง':loc)+' • '+fmt(cr)+' กระบะ'+(pr?' • '+fmt(pr,2)+' บ./กก.':''),fmt(kg,2)+' กก.']);}
      else{const it=itemBy(val(d,'.it')),q=n(val(d,'.qty')),b=n(val(d,'.base')),loc=segVal(d,'dest');
        if(!it||!(q>0)){errs.push(`รายการที่ ${i+1}: เลือกรายการและกรอกจำนวน`);return;}
        if(!it.pack&&!(b>0)){errs.push(`รายการที่ ${i+1}: กรอกจำนวนรวม (${it.base}) จากใบส่งของ`);return;}
        const base=it.pack?q*it.pack:b;const pr=val(d,'.price');lines.push({item:it.name,loc,qty:q,base,lot:val(d,'.lot'),exp:val(d,'.exp'),price:pr});
        sum.push([it.name,(loc===LINE?'เข้าไลน์ผลิตตรง':loc)+' • '+fmt(q)+' '+it.unit+(pr?' • '+fmt(pr,2)+' บ./'+it.unit:''),fmt(base)+' '+it.base]);}
    });
    return {errs,sum,head:sup+(val(null,'#doc')?' • เอกสาร '+val(null,'#doc'):'')+(photoData?' • มีรูปใบส่งของ':''),payload:{supplier:sup,doc:val(null,'#doc'),note:val(null,'#note'),photo:photoData,lines}};
  };
}

const obxHtml=()=>{const L=M().items.filter(i=>i.cat==='บรรจุภัณฑ์ออนไลน์'||i.name==='ถุงแพ็ค 10').concat(M().items.filter(i=>i.cat==='บรรจุภัณฑ์'&&/^กล่อง \d+$/.test(i.name)).sort((a,b)=>parseInt(a.name.slice(6))-parseInt(b.name.slice(6))));return L.length?`<section class="panel" id="obox" hidden><h3>กล่องที่ใช้แพ็ก (ออนไลน์)</h3><div class="hint">กรอกเฉพาะกล่องที่ใช้ ระบบตัดสต๊อก<b>กล่องเปล่า</b>ให้อัตโนมัติ • กล่อง 20–100 ตรงนี้ = กล่องเปล่าใช้แพ็ก <b>ไม่ตัดสต๊อกปลากระป๋อง</b></div><div class="szgrid">${L.map(i=>`<label class="szc"><span>${esc(i.name)}</span><input class="obx num" data-item="${esc(i.name)}" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></label>`).join('')}</div></section>`:'<div id="obox" hidden></div>';};

  <div class="field"><label for="tp">ประเภทการเคลื่อนย้าย</label><select id="tp"><option value="">เลือกประเภท</option>${M().moveTypes.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div></div>

  <div class="field"><label for="ref">เลขอ้างอิง (ออเดอร์/ใบส่ง/ใบโอน)</label><input id="ref"></div></div>
  <div class="field" id="cashF" hidden><label for="cash">เงินรับหน้าร้าน (บาท)</label><input id="cash" class="num" type="number" inputmode="decimal" min="0"></div>

  <section class="panel"><h3>สินค้าที่จ่ายออก</h3><div class="list" id="lines"></div><button type="button" class="add" id="add">+ เพิ่มสินค้า</button>
  <div class="field"><label for="note">หมายเหตุ <span class="opt">(ถ้ามี)</span></label><textarea id="note"></textarea></div></section>${obxHtml()}`);
  $('#ch').onchange=()=>{$('#obox').hidden=!/ออนไลน์|online/i.test(val(null,'#ch'));};
  $('#tp').onchange=()=>$('#cashF').hidden=!/หน้าร้าน/.test(val(null,'#tp'));
  const add=()=>addLine('#lines',`<div class="field"><label>สินค้า (SKU)</label><select class="sku">${skuOptions(true)}</select></div>

    <div class="hint">แพ็คพิเศษ = จำนวน<b>กระป๋อง</b>รวมที่ไม่ได้อยู่ในกล่องปกติ (ออเดอร์ผสม) • ตัดจากกระป๋องติดฉลากที่ยังไม่ลงกล่อง</div>
    <details class="opn"><summary>แกะกล่องเพื่อเอากระป๋องมาใช้ (ถ้ามี)</summary><div class="szgrid">${SIZES.map(z=>`<label class="szc"><span>แกะ${z[1]}</span><input class="opz num" data-z="${z[0]}" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></label>`).join('')}</div><div class="hint">ระบบลดสต๊อกกล่องที่แกะ และเพิ่มเป็นกระป๋องหลวมให้อัตโนมัติ</div></details></div>
    <div class="field btf" hidden><label>จำนวน (ขวด)</label><input class="bx num" type="number" inputmode="numeric" min="0" step="1"></div>`,'สินค้าที่');
  const isBottle=x=>((M().skus.find(s=>s.name===x)||{}).unit==='ขวด');
  const add2=()=>{const d=add();const sel=d.querySelector('.sku');sel.onchange=()=>{const b=isBottle(sel.value);d.querySelector('.szf').hidden=b;d.querySelector('.btf').hidden=!b;};return d;};
  $('#add').onclick=add2;add2();
  pending=()=>{const ch=val(null,'#ch'),tp=val(null,'#tp'),lines=[],sum=[],errs=[],openBoxes=[];if(!ch)errs.push('เลือกช่องทาง');if(!tp)errs.push('เลือกประเภทการเคลื่อนย้าย');
    $$('#lines .item').forEach((d,i)=>{const s=val(d,'.sku');if(!s){errs.push(`สินค้าที่ ${i+1}: เลือกสินค้า`);return;}
      if(isBottle(s)){const b=n(val(d,'.bx'));if(!(b>0)){errs.push(`สินค้าที่ ${i+1}: กรอกจำนวนขวด`);return;}lines.push({sku:s,size:'1',boxes:b});sum.push([s,'ขวด',fmt(b)+' ขวด']);return;}
      let k=0;$$('.bxz',d).forEach(x=>{const b=n(x.value.trim()),z=x.dataset.z;if(!(b>0))return;k++;lines.push({sku:s,size:z,boxes:b});sum.push([s,'กล่อง '+z,fmt(b)+' กล่อง']);});
      const sp=n(val(d,'.spc'));if(sp>0){k++;lines.push({sku:s,size:'1',boxes:sp});sum.push([s,'แพ็คพิเศษ',fmt(sp)+' กป']);}
      $$('.opz',d).forEach(x=>{const q=n(x.value.trim());if(q>0){k++;openBoxes.push({sku:s,size:x.dataset.z,qty:q});sum.push([s,'แกะกล่อง '+x.dataset.z,fmt(q)+' กล่อง']);}});
      if(!k)errs.push(`สินค้าที่ ${i+1}: กรอกจำนวนอย่างน้อย 1 ขนาด`);});
    const packBoxes=[];if(!$('#obox').hidden)$$('.obx').forEach(x=>{const q=n(x.value.trim());if(q>0){packBoxes.push({item:x.dataset.item,qty:q});sum.push([x.dataset.item,'กล่องแพ็กออนไลน์',fmt(q)+' ใบ']);}});
    return {errs,sum,head:ch+' • '+tp+(val(null,'#cust')?' • '+val(null,'#cust'):''),payload:{channel:ch,type:tp,ref:val(null,'#ref'),customer:val(null,'#cust'),cash:val(null,'#cash'),note:val(null,'#note'),lines,packBoxes,openBoxes}};};
}

/* ---------- ตรวจนับ ---------- */
const CGROUPS=[['ปลา',i=>i.cat==='ปลา'],['ส่วนผสมซอส / วัตถุดิบ',i=>i.cat==='วัตถุดิบ'],['ฉลาก',i=>/^ฉลาก/.test(i.name)],['กระป๋อง ฝา กล่อง ถุง',i=>i.cat==='บรรจุภัณฑ์'],['กล่องออนไลน์',i=>i.cat==='บรรจุภัณฑ์ออนไลน์'],['สินค้า OEM',i=>i.cat==='สินค้า OEM'],['วัสดุสิ้นเปลือง',i=>i.cat==='วัสดุสิ้นเปลือง'],['พลังงาน',i=>i.cat==='พลังงาน'],['อื่นๆ',()=>true]];
function fCount(){
  shell('count',`<section class="panel"><div class="field"><label>รอบการนับ</label>${seg('ctype',[['วัน','ประจำวัน'],['สัปดาห์','ประจำสัปดาห์'],['เดือน','ประจำเดือน']],'วัน')}</div>
  <div class="field"><label for="loc">สถานที่นับ</label><select id="loc"></select></div>
  <div class="field"><label for="q">ค้นหารายการ</label><input id="q" placeholder="พิมพ์ชื่อ เช่น แชลั้น กล่อง ฉลาก"></div>
  <div class="hint">ห้องเย็น = นับปลา • คลังวัตถุดิบ = ส่วนผสม ฉลาก กล่อง OEM ฯลฯ • แตะหัวข้อเพื่อเปิด/ปิด • กรอกเฉพาะที่นับ • 0 = นับแล้วไม่มีของ • ช่องว่าง = ไม่ได้นับ</div></section>
  <section class="panel"><h3 id="cTitle">รายการ</h3><div id="rows"></div>
  <div class="field"><label for="note">หมายเหตุ <span class="opt">(ถ้ามี)</span></label><textarea id="note"></textarea></div></section>`);
  const ctype=()=>{const b=$('[data-seg="ctype"] button[aria-pressed="true"]');return b?b.dataset.v:'วัน';};
  const setType=v=>$$('[data-seg="ctype"] button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));
  const locOpts=()=>{$('#loc').innerHTML=M().locations.filter(l=>l.factory===factory&&l.type!=='ไลน์ผลิต').map(l=>`<option data-type="${esc(l.type)}">${esc(l.name)}</option>`).join('');rows();};
  const tally=()=>$$('#rows details.cg').forEach(d=>{const ins=$$('.cq',d);d.querySelector('.cnt').textContent=ins.filter(x=>x.value.trim()!=='').length+'/'+ins.length;});
  const rows=()=>{const o=$('#loc').selectedOptions[0];const cold=o&&o.dataset.type==='ห้องเย็น';setType(cold?'วัน':'สัปดาห์');
    const list=cold?fishItems():otherItems();const groups=CGROUPS.map(g=>[g[0],[]]);
    list.forEach(i=>{const k=CGROUPS.findIndex(g=>g[1](i));groups[k][1].push(i);});
    $('#cTitle').textContent=cold?'ปลา (กก.)  •  ช่องขวา = กักกัน/รอ QC':'วัตถุดิบ บรรจุภัณฑ์ และอื่นๆ';
    $('#rows').innerHTML=groups.filter(g=>g[1].length).map(g=>`<details class="cg"${cold?' open':''}><summary><span>${esc(g[0])}</span><span class="chip cnt"></span></summary>`+g[1].map(i=>`<div class="qrow ${cold?'fish':''}" data-item="${esc(i.name)}"><span>${esc(i.name)}</span><input class="num cq" type="number" inputmode="decimal" min="0" step="0.01" aria-label="${esc(i.name)}">${cold?'<input class="num qc" type="number" inputmode="decimal" min="0" step="0.01" placeholder="QC" aria-label="QC">':`<span class="u">${esc(i.base)}</span>`}</div>`).join('')+'</details>').join('');
    tally();};
  refreshLocs=locOpts;$('#loc').onchange=rows;locOpts();
  $('#rows').addEventListener('input',tally);
  $('#q').oninput=()=>{const q=val(null,'#q');$$('#rows details.cg').forEach(d=>{let any=false;$$('.qrow',d).forEach(r=>{r.hidden=!!q&&!r.dataset.item.includes(q);if(!r.hidden)any=true;});d.hidden=!!q&&!any;if(q&&any)d.open=true;});};
  pending=()=>{const loc=val(null,'#loc'),lines=[],sum=[],errs=[],t=ctype();
    $$('#rows .qrow').forEach(r=>{const v=r.querySelector('.cq').value.trim();if(v==='')return;const q=Number(v);if(!(q>=0)){errs.push(r.dataset.item+': ตัวเลขไม่ถูกต้อง');return;}
      const it=itemBy(r.dataset.item),qc=r.querySelector('.qc')?r.querySelector('.qc').value.trim():'';lines.push({item:it.name,qty:q,qc});sum.push([it.name,qc?'กักกัน/QC '+fmt(qc):'',fmt(q,2)+' '+it.base]);});
    if(!lines.length&&!errs.length)errs.push('ยังไม่ได้กรอกยอดนับ');
    const note=val(null,'#note');
    return {errs,sum,head:'ตรวจนับประจำ'+t+' • '+loc,payload:{loc,note:'[นับประจำ'+t+']'+(note?' '+note:''),lines}};};
}

/* ---------- ซ่อมบำรุงเครื่องจักร (loads its data only when this tab is opened) ---------- */
const MT_TEST=false; // true = show the "ทดสอบ" chip (trial period)

   mtView='pm', mtHistM='';

/* แผน PM: เลยกำหนด / ใกล้ถึงกำหนด / ประจำวัน / ยังไม่เคยบันทึก / ปกติ */
function mtPm(){
  const G=[['over','เลยกำหนด','over'],['soon','ใกล้ถึงกำหนด','soon'],['daily','งานประจำวัน • ยังไม่ทำวันนี้',''],['never','ยังไม่เคยบันทึก',''],['ok','ปกติ / ทำแล้ว','okc']];
  const row=(x,g)=>{const i=MT.pm.indexOf(x);
    const when=x.st==='over'?'เลยมา '+(-x.days)+' วัน':x.st==='soon'?(x.days===0?'ถึงกำหนดวันนี้':'อีก '+x.days+' วัน'):x.st==='daily'?'วันนี้ยังไม่ทำ':x.st==='never'?'ยังไม่เคยบันทึก':x.freq===1?'ทำแล้ววันนี้':'กำหนด '+mtD(x.next);
    return `<div class="entry"><span class="t">${mtName(x)}</span><button type="button" class="linkbtn" data-pm="${i}">บันทึก →</button>
    <div class="meta"><span class="chip ${g[2]}">${esc(when)}</span><span>${esc(x.task)}</span><span>${mtFreq(x.freq)} • ล่าสุด ${mtD(x.last)}</span></div></div>`;};
  $('#mt').innerHTML=MT.pm.length?G.map(g=>{const L=MT.pm.filter(x=>x.st===g[0]).sort((a,b)=>(a.days==null?0:a.days)-(b.days==null?0:b.days));
    if(!L.length)return '';
    const body=`<div class="list">${L.map(x=>row(x,g)).join('')}</div>`;
    return g[0]==='ok'||g[0]==='never'?`<section class="panel"><details><summary>${g[1]} (${L.length})</summary>${body}</details></section>`:`<section class="panel"><h3>${g[1]} <span class="opt">(${L.length})</span></h3>${body}</section>`;}).join('')
    +'<p class="hint" style="text-align:center">ความถี่และรายการงาน แก้ได้ในชีต "แผน PM" • เตือนล่วงหน้า 7 วัน (งานรายเดือนขึ้นไป) / 1 วัน (งานรายสัปดาห์)</p>'
    :'<section class="panel"><div class="empty">ยังไม่มีแผน PM ของโรงงานนี้</div></section>';
  $$('[data-pm]').forEach(b=>b.onclick=()=>{const x=MT.pm[b.dataset.pm];mtForm({machine:x.machine,unit:x.unit,type:'PM ตามแผน',pm:[x.code]});});
}
const mtEntry=(l,extra)=>`<div class="entry"><span class="t">${mtName(l)}</span><span class="kg">${l.down?fmt(l.down)+' นาที':''}</span>
  <div class="meta"><span class="chip ${l.status==='รอติดตาม'?'soon':'okc'}">${esc(l.status)}</span><span class="chip">${esc(l.type)}</span><span>${mtD(l.date)} ${esc(l.time)} น. • ${esc(l.who)}</span></div>
  <div class="mtd">${l.problem?`<p><b>ปัญหา:</b> ${esc(l.problem)}</p>`:''}<p><b>ที่ทำ:</b> ${esc(l.action)}</p>${l.parts?`<p><b>อะไหล่:</b> ${esc(l.parts)}</p>`:''}${l.checks?`<p><b>ผลตรวจ:</b> ${esc(l.checks)}</p>`:''}${l.closedBy?`<p><b>ปิดงาน:</b> ${esc(l.closedBy)} ${esc(l.closedAt)}${l.closeNote?' • '+esc(l.closeNote):''}</p>`:''}</div>${extra||''}</div>`;

}
function mtDown(){
  const M=MT.down.months, rows=MT.down.rows.map(r=>({...r,t:r.m.reduce((a,b)=>a+b,0)})).sort((a,b)=>b.m[M.length-1]-a.m[M.length-1]||b.t-a.t);
  const ml=k=>new Date(k+'-01T00:00').toLocaleDateString('th-TH',{month:'short'});
  const tot=M.map((_,i)=>rows.reduce((a,r)=>a+r.m[i],0));
  $('#mt').innerHTML=`<section class="panel"><h3>เวลาหยุดเครื่องรายเดือน (นาที)</h3>${rows.length?`<div class="tbl"><table><thead><tr><th>เครื่องจักร</th>${M.map(k=>`<th>${ml(k)}</th>`).join('')}<th>รวม</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${esc(r.machine)}</td>${r.m.map(v=>`<td class="num">${v?fmt(v):'–'}</td>`).join('')}<td class="num"><b>${fmt(r.t)}</b></td></tr>`).join('')}
  <tr><td><b>รวมทุกเครื่อง</b></td>${tot.map(v=>`<td class="num"><b>${v?fmt(v):'–'}</b></td>`).join('')}<td class="num"><b>${fmt(tot.reduce((a,b)=>a+b,0))}</b></td></tr></tbody></table></div>
  <p class="hint">6 เดือนล่าสุด • เรียงจากเครื่องที่หยุดมากที่สุดในเดือนนี้ • นับทุกประเภทงานที่กรอกนาทีหยุดเครื่อง</p>`:'<div class="empty">ยังไม่มีการหยุดเครื่องใน 6 เดือนนี้</div>'}</section>`;
}
/* แบบฟอร์มบันทึกงาน */
function mtForm(pre){
  const now=new Date(), hm=('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2);
  $('#view').innerHTML=`<div class="head"><button type="button" class="back" id="back">← กลับ</button><h2>บันทึกงานซ่อมบำรุง</h2></div>
  <form id="mf" novalidate><section class="panel"><div class="grid2 keep"><div class="field"><label for="md">วันที่</label><input type="date" id="md" value="${MT.today}" max="${MT.today}"></div>
  <div class="field"><label for="mtm">เวลา</label><input type="time" id="mtm" value="${hm}"></div></div>
  <div class="field"><label for="mm">เครื่องจักร</label><select id="mm"><option value="">เลือกเครื่องจักร</option>${MT.machines.map(m=>`<option${m.name===pre.machine?' selected':''}>${esc(m.name)}</option>`).join('')}</select></div>
  <div class="field" id="muF" hidden><label for="mu">เครื่องที่</label><select id="mu"></select></div>
  <div class="field"><span class="lbl">ประเภทงาน</span>${seg('mtype',MT.types,pre.type||'')}</div></section>
  <section class="panel" id="mpmP" hidden><h3>งาน PM ที่ทำ</h3><div id="mpm" class="list"></div></section>
  <section class="panel" id="mckP" hidden><h3>รายการตรวจบังคับ</h3><div class="hint">ต้องกรอกทุกข้อ • ถ้ามีข้อ "ไม่ผ่าน" ให้เลือกสถานะ รอติดตาม</div><div id="mck" class="list"></div></section>
  <section class="panel"><div class="field"><label for="mp">ปัญหา / อาการ <span class="opt" id="mpO">(ถ้ามี)</span></label><textarea id="mp"></textarea></div>
  <div class="field"><label for="ma">สิ่งที่ทำ / การแก้ไข</label><textarea id="ma"></textarea></div>
  <div class="field"><label for="mpt">อะไหล่ที่เปลี่ยน <span class="opt">(ถ้ามี)</span></label><input id="mpt"></div>
  <div class="grid2 keep"><div class="field"><label for="mdn">หยุดเครื่อง (นาที)</label><input id="mdn" class="num" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></div>
  <div class="field"><label for="mw">ผู้ทำ</label><input id="mw" value="${esc(B.user.name)}"></div></div>
  <div class="field"><span class="lbl">สถานะ</span>${seg('mst',MT.statuses,'เสร็จ')}</div></section>
  <div class="err" id="merr" hidden></div><button type="submit" class="primary" id="msave">บันทึก</button></form>`;
  $('#back').onclick=fMaint;
  const mach=()=>MT.machines.find(m=>m.name===$('#mm').value);
  const type=()=>segVal(null,'mtype');
  const sync=()=>{const m=mach(),t=type();
    $('#muF').hidden=!m||m.units<2;
    if(m){const cur=$('#mu').value||pre.unit||1;$('#mu').innerHTML=Array.from({length:m.units},(_,i)=>`<option${i+1==cur?' selected':''}>${i+1}</option>`).join('');}
    const tasks=m?MT.tasks.filter(x=>x.machine===m.name):[];
    $('#mpmP').hidden=!(m&&t==='PM ตามแผน');
    const had=$$('#mpm input:checked').map(x=>x.value).concat(pre.pm||[]);
    $('#mpm').innerHTML=tasks.length?tasks.map(x=>`<label class="mtck"><input type="checkbox" value="${esc(x.code)}"${had.includes(x.code)?' checked':''}><span>${esc(x.task)} <span class="opt">(${mtFreq(x.freq)})</span></span></label>`).join(''):'<div class="empty">เครื่องนี้ยังไม่มีแผน PM ในชีต</div>';
    const ck=m&&t&&t!=='ทำความสะอาด'?(MT.checks[m.name]||[]):[];
    $('#mckP').hidden=!ck.length;
    if($('#mck').dataset.m!==(m?m.name:'')+'|'+ck.length){$('#mck').dataset.m=(m?m.name:'')+'|'+ck.length;
      $('#mck').innerHTML=ck.map((c,i)=>c.type==='num'?`<div class="field"><label for="ck${i}">${esc(c.label)}${c.unit?' <span class="opt">('+esc(c.unit)+')</span>':''}</label><input id="ck${i}" class="num ckv" data-l="${esc(c.label)}" type="number" inputmode="decimal" min="0" step="0.01"></div>`
        :`<div class="field ckpf" data-l="${esc(c.label)}"><span class="lbl">${esc(c.label)}</span>${seg('ck'+i,['ผ่าน','ไม่ผ่าน'],'')}</div>`).join('');}
    $('#mpO').textContent=t==='ซ่อมเมื่อเสีย'?'':'(ถ้ามี)';
  };
  $('#mm').onchange=()=>{pre.pm=[];$$('#mpm input').forEach(x=>x.checked=false);sync();};
  $('[data-seg="mtype"]').addEventListener('segchange',sync);
  sync(); pre.pm=[]; window.scrollTo(0,0);
  $('#mf').onsubmit=e=>{e.preventDefault();
    const m=mach(),t=type(),errs=[],checks={};
    if(!m)errs.push('เลือกเครื่องจักร');if(!t)errs.push('เลือกประเภทงาน');
    const pm=$('#mpmP').hidden?[]:$$('#mpm input:checked').map(x=>x.value);
    if(m&&t==='PM ตามแผน'&&!pm.length)errs.push('เลือกงาน PM ที่ทำอย่างน้อย 1 งาน');
    if(t==='ซ่อมเมื่อเสีย'&&!val(null,'#mp'))errs.push('กรอกปัญหา / อาการ');
    if(!val(null,'#ma'))errs.push('กรอกสิ่งที่ทำ / การแก้ไข');
    const dn=val(null,'#mdn');if(dn!==''&&!(Number(dn)>=0))errs.push('นาทีที่หยุดเครื่องไม่ถูกต้อง');
    if(t==='ซ่อมเมื่อเสีย'&&dn==='')errs.push('กรอกนาทีที่หยุดเครื่อง (ไม่หยุด ใส่ 0)');
    const st=segVal(null,'mst');let fail=false;
    if(!$('#mckP').hidden){$$('#mck .ckv').forEach(x=>{if(x.value.trim()==='')errs.push('รายการตรวจบังคับ: '+x.dataset.l);else checks[x.dataset.l]=x.value.trim();});
      $$('#mck .ckpf').forEach(f=>{const b=f.querySelector('[aria-pressed="true"]');if(!b)errs.push('รายการตรวจบังคับ: '+f.dataset.l);else{checks[f.dataset.l]=b.dataset.v;if(b.dataset.v==='ไม่ผ่าน')fail=true;}});}
    if(fail&&st!=='รอติดตาม')errs.push('มีรายการตรวจที่ไม่ผ่าน ให้เลือกสถานะ "รอติดตาม"');
    const er=$('#merr');
    if(errs.length){er.innerHTML=errs.map(esc).join('<br>');er.hidden=false;er.scrollIntoView({behavior:'smooth',block:'center'});return;}
    er.hidden=true;const btn=$('#msave');btn.disabled=true;btn.textContent='กำลังบันทึก…';
    run('mtSave',{factory:MT.fac,date:val(null,'#md'),time:val(null,'#mtm'),machine:m.name,unit:m.units>1?Number($('#mu').value):1,type:t,pm:pm,problem:val(null,'#mp'),action:val(null,'#ma'),parts:val(null,'#mpt'),down:dn,who:val(null,'#mw'),status:st,checks:checks})
      .then(d=>{MT=d;mtFac=d.fac;toast('บันทึกแล้ว ✓');if(st==='รอติดตาม')mtView='open';fMaint();})
      .catch(err=>{toast('บันทึกไม่สำเร็จ: '+(err&&err.message||err),true);btn.disabled=false;btn.textContent='บันทึก';});
  };
}

/* ---------- review + submit ---------- */
let current=null;
function review(kind){
  const r=pending(); const e=$('#err');
  const back=dateBack();
  if(back==null)r.errs.unshift('เลือกวันที่');
  else if(back<0)r.errs.unshift('วันที่เป็นวันในอนาคต ตรวจสอบวันที่อีกครั้ง');
  else if(back>DATE_MAX_BACK&&!B.isAdmin)r.errs.unshift('วันที่ย้อนหลัง '+back+' วัน (เกิน '+DATE_MAX_BACK+' วัน) — ตรวจสอบว่าวัน/เดือนไม่สลับกัน ถ้าต้องบันทึกย้อนหลังจริง ให้แจ้งออฟฟิศ');
  if(r.errs.length){e.innerHTML=r.errs.map(esc).join('<br>');e.hidden=false;e.scrollIntoView({behavior:'smooth',block:'center'});return;}
  e.hidden=true; r.payload.date=val(null,'#date'); r.payload.factory=factory; current={kind,payload:r.payload};
  $('#ovHead').textContent=new Date(r.payload.date+'T00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})+' • '+factory+' • '+r.head+(back>0?' • ⚠ ย้อนหลัง '+back+' วัน':'');
  $('#ovList').innerHTML=r.sum.map(s=>`<div class="sum-row"><div><b>${esc(s[0])}</b><small>${esc(s[1])}</small></div><b class="num">${esc(s[2])}</b></div>`).join('');
  $('#ov').hidden=false; $('#ovOk').disabled=false; $('#ovOk').focus();
}
$('#ovBack').onclick=()=>$('#ov').hidden=true;
$('#ovOk').onclick=()=>{
  $('#ovOk').disabled=true; $('#ovOk').textContent='กำลังบันทึก…';
  run('submit',current.kind,current.payload).then(res=>{
    $('#ov').hidden=true; B.recent=res.recent||B.recent; toast('บันทึกแล้ว ✓'); home();
  }).catch(err=>{toast('บันทึกไม่สำเร็จ: '+(err&&err.message||err),true);}).finally(()=>{$('#ovOk').disabled=false;$('#ovOk').textContent='ยืนยันบันทึก';});
};
})();
</script>
